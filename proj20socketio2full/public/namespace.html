<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>네임스페이스 채팅</title>
</head>
<body>
  <h1>네임스페이스 채팅</h1>
  <button id="chatNamespace">Chat 네임스페이스 연결</button>
  <button id="newsNamespace">News 네임스페이스 연결</button>

  <input type="text" id="messageInput" placeholder="메시지 입력">
  <button id="sendBtn">전송</button>
  <ul id="messages"></ul>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script>
    let socket;

    document.getElementById('chatNamespace').addEventListener('click', () => {
      socket = io('/chat');
      setupSocketEvents();
    });

    document.getElementById('newsNamespace').addEventListener('click', () => {
      socket = io('/news');
      setupSocketEvents();
    });

    function setupSocketEvents() {
      socket.on('message', (msg) => {
        const li = document.createElement('li');
        li.textContent = msg;
        messages.appendChild(li);
      });

      sendBtn.addEventListener('click', () => {
        const msg = messageInput.value;
        socket.emit('message', msg);
        messageInput.value = '';
      });
    }
  </script>
</body>
</html>
